<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Legal Docs Redactor{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
          crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --brand-dark: #1a237e;
            --brand-mid: #283593;
            --brand-accent: #3949ab;
        }

        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand-accent) 100%);
            box-shadow: 0 2px 8px rgba(0,0,0,.25);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: .03em;
        }

        .navbar-brand i {
            font-size: 1.5rem;
        }

        .nav-link {
            font-weight: 500;
        }

        main {
            flex: 1;
        }

        footer {
            background: var(--brand-dark);
            color: rgba(255,255,255,.7);
            padding: 1rem 0;
            font-size: .875rem;
        }

        footer a {
            color: rgba(255,255,255,.85);
        }

        /* Generic status badge helpers */
        .badge-status-PENDING    { background-color: #6c757d; }
        .badge-status-PROCESSING { background-color: #fd7e14; }
        .badge-status-COMPLETED  { background-color: #198754; }
        .badge-status-FAILED     { background-color: #dc3545; }
        .badge-status-SKIPPED    { background-color: #0dcaf0; color:#000; }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'index' %}">
            <i class="bi bi-shield-lock-fill"></i>
            Legal Docs Redactor
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto gap-1">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'index' %}">
                        <i class="bi bi-upload me-1"></i>Upload
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'job_list' %}">
                        <i class="bi bi-list-task me-1"></i>All Jobs
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===== MAIN CONTENT ===== -->
<main class="py-4">
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</main>

<!-- ===== FOOTER ===== -->
<footer class="mt-auto">
    <div class="container text-center">
        <span>&copy; {% now "Y" %} Legal Docs Redactor &mdash; Powered by spaCy &amp; Django</span>
    </div>
</footer>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
